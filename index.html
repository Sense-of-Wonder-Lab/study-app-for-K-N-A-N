<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffb84d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まなびランド">
<title>まなびランド</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#3b2f2a; --sub:#8a7a70; --accent:#ff9f2e; --accent2:#4aa8ff;
  --line:#f0e2cf; --ok:#3cc47c; --ng:#ff5a5a; --orange:#ff9f2e; --blue:#4aa8ff; --green:#3cc47c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background .3s;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
#app{max-width:1100px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;gap:16px}
.screen.on{display:flex}
h1{font-size:40px;margin:8px 0 0;text-align:center;letter-spacing:.05em}
h2{font-size:30px;margin:0;text-align:center}
.title{color:var(--accent);font-size:36px}
.sub{color:var(--sub);text-align:center;font-size:18px;margin:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.big{background:var(--card);border-radius:24px;padding:22px 14px;font-size:26px;font-weight:700;
  box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.big .emoji{font-size:56px;line-height:1}
.big .note{font-size:16px;font-weight:400;color:var(--sub)}
.big.locked{opacity:.45}
.bar{display:flex;align-items:center;gap:12px}
.bar .grow{flex:1}
.back{background:var(--card);border-radius:16px;padding:12px 18px;font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.timebox{flex:1;background:var(--card);border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 var(--line)}
.timebox .lbl{font-size:16px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.timebox .lbl b{color:var(--ink);font-size:20px}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .5s}
.meter i.low{background:var(--orange)} .meter i.crit{background:var(--ng)}
/* モード切りかえ */
.seg{display:flex;background:var(--card);border-radius:18px;padding:6px;box-shadow:0 3px 0 var(--line);gap:6px}
.seg button{flex:1;padding:14px 8px;border-radius:14px;font-size:22px;font-weight:800;background:transparent;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
/* プレイ画面 */
.playwrap{display:flex;flex-direction:column;gap:14px;flex:1}
.stage{display:flex;flex-direction:column;gap:12px}
.arena{background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:12px 16px 6px;position:relative;overflow:hidden}
.mon-head{display:flex;align-items:center;gap:12px}
.mon-name{font-size:22px;font-weight:800;white-space:nowrap}
.mon-name .boss{background:#ffd23f;color:#5a4300;border-radius:8px;padding:2px 8px;font-size:15px;margin-right:6px;vertical-align:middle}
.hp{flex:1;height:18px;background:var(--line);border-radius:9px;overflow:hidden;border:2px solid var(--line)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a5a,#ff9f2e);border-radius:9px;transition:width .35s}
.hpnum{flex-shrink:0;font-size:16px;color:var(--sub);font-weight:700;min-width:3.5em;text-align:right}
.mon{height:250px;display:flex;justify-content:center;align-items:flex-end}
.mon svg{height:100%;width:auto;will-change:transform;animation:bob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.02,.98)}}
.mon.hit svg{animation:hit .45s}
@keyframes hit{0%{transform:translateX(0);opacity:1}15%{transform:translateX(-14px) rotate(-6deg);opacity:.35}35%{transform:translateX(12px) rotate(5deg);opacity:1}55%{transform:translateX(-8px);opacity:.5}100%{transform:translateX(0);opacity:1}}
.mon.attack svg{animation:atk .55s}
@keyframes atk{0%{transform:scale(1)}30%{transform:scale(1.35) translateY(12px)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.mon.down svg{animation:down 1.1s forwards}
@keyframes down{0%{transform:none;filter:none;opacity:1}10%{transform:scale(1.25,.8);filter:brightness(3) saturate(0)}22%{transform:scale(.9,1.15) rotate(-8deg);filter:brightness(1.6)}34%{transform:translateY(-30px) rotate(10deg);filter:none}100%{transform:translateY(-160px) rotate(720deg) scale(.1);opacity:0}}
.dmg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#ff5a5a;
  -webkit-text-stroke:2px #fff;pointer-events:none;opacity:0;white-space:nowrap}
.dmg.show{animation:dmg .8s}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ta{display:flex;justify-content:space-around;align-items:center;height:220px}
.ta div{text-align:center}
.ta b{display:block;font-size:84px;line-height:1.1}
.ta span{font-size:20px;color:var(--sub)}
.ta .t b{color:var(--accent2)} .ta .t.crit b{color:var(--ng)}
.qcard{background:var(--card);border-radius:28px;padding:16px 20px;text-align:center;box-shadow:0 6px 0 var(--line);position:relative}
.qnum{font-size:18px;color:var(--sub)}
.question{font-size:60px;font-weight:800;margin:4px 0;line-height:1.25;word-break:keep-all}
.question.small{font-size:42px}
.answer{font-size:54px;font-weight:800;min-height:72px;border-bottom:4px dashed var(--line);display:inline-block;min-width:200px;color:var(--accent2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;width:100%;margin:0 auto}
.keypad button{background:var(--card);border-radius:20px;font-size:42px;font-weight:800;padding:22px 0;box-shadow:0 5px 0 var(--line)}
.keypad button:active,.keypad button.pressed{transform:translateY(3px);box-shadow:0 2px 0 var(--line);background:var(--line)}
.keypad button{touch-action:none}
.keypad .del{font-size:26px;color:var(--sub)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices button{background:var(--card);border-radius:22px;padding:16px 10px;font-size:32px;font-weight:800;box-shadow:0 5px 0 var(--line);min-height:100px;line-height:1.25}
.choices button small{display:block;font-size:17px;font-weight:400;color:var(--sub)}
.choices button.right{background:var(--ok);color:#fff;box-shadow:0 5px 0 #2a9a5f}
.choices button.right small{color:#eafff2}
.choices button.wrong{background:var(--ng);color:#fff;box-shadow:0 5px 0 #c94040;opacity:.55}
.choices button.wrong small{color:#fff}
.choices.eight{grid-template-columns:repeat(4,1fr)}
.choices.eight button{font-size:26px;min-height:84px}
.feedback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;pointer-events:none;opacity:0}
.feedback.show{animation:pop .45s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.qp{font-size:26px;font-weight:800;margin:2px 0 6px;line-height:1.4}
#calc-img svg{width:190px;height:190px}
.question.tiny{font-size:32px}
.playwrap.compact .mon{height:110px} .playwrap.compact #calc-img svg{width:200px;height:200px}
.playwrap.mid .mon{height:170px}
.playwrap.compact .qcard,.playwrap.mid .qcard{padding:10px 16px}
.slot{display:inline-block;min-width:1.5em;min-height:1.1em;padding:0 .12em;margin:0 .08em;border-bottom:5px dashed var(--line);color:var(--accent2);line-height:1.1;vertical-align:baseline;text-align:center}
.slot.on{border-bottom:5px solid var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent);border-radius:8px 8px 0 0}
.slot.done{border-bottom:none;min-width:0;color:var(--ng)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.78em;line-height:1.1;margin:0 .12em}
.frac>span:first-child{border-bottom:4px solid currentColor;padding:0 .15em .05em;min-width:1.2em;text-align:center}
.frac .slot{font-size:1em;min-width:1.2em}
.keypad .dot{font-size:48px}
.ghead{grid-column:1/-1;margin:6px 0 -6px;font-size:22px;color:var(--accent)}
.correct-ans .question,.correct-ans{}
.correct-ans{font-size:24px;color:var(--ng);min-height:32px;font-weight:700}
.combo{font-size:22px;font-weight:900;color:var(--accent);min-height:30px}
/* 結果 */
.result{text-align:center;background:var(--card);border-radius:28px;padding:24px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.r-mon{height:200px} .r-mon svg{height:100%;animation:bob 2.2s ease-in-out infinite}
.r-mon.appear svg{animation:appear .8s, bob 2.2s ease-in-out .8s infinite}
@keyframes appear{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.r-get{font-size:30px;font-weight:900}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:34px}
.badge{border-radius:999px;padding:4px 14px;font-size:18px;font-weight:800;color:#fff;background:var(--ng)}
.badge.kira{background:linear-gradient(90deg,#ff5e8a,#ffb12e,#45d483,#4aa8ff)}
.badge.best{background:var(--accent2)}
.stars{font-size:52px;letter-spacing:6px}
.score{font-size:40px;font-weight:800}
.btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:20px;padding:18px 28px;font-size:26px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.15);color:#fff;background:var(--accent2)}
.btn.main{background:var(--accent)}
/* ずかん */
.zk-count{font-size:22px;font-weight:800;text-align:center}
.zk-group{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line)}
.zk-group h3{margin:0 0 8px;font-size:20px}
.zk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.zk-cell{background:var(--bg);border-radius:16px;padding:6px 4px 8px;text-align:center;font-size:15px;font-weight:700;position:relative}
.zk-cell svg{width:100%;height:auto;max-height:120px}
.zk-cell .k{position:absolute;top:4px;right:6px;font-size:18px}
.zk-cell.none{color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:28px;padding:24px;text-align:center;max-width:420px;width:100%}
.modal .box svg{width:240px;height:240px;animation:bob 2.2s ease-in-out infinite}
.modal .box h3{font-size:30px;margin:4px 0}
.modal .box p{color:var(--sub);font-size:18px;margin:4px 0}
/* おしまい */
.timeup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.timeup .emoji{font-size:120px}
/* 保護者 */
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:18px}
.row input,.row select{font-size:20px;padding:10px;border-radius:12px;border:2px solid var(--line);font-family:inherit;background:#fff;color:#3b2f2a;-webkit-user-select:text;user-select:text}
.row input[type=text]{width:9em}
.sbtn{border-radius:12px;padding:10px 16px;font-size:18px;font-weight:700;background:var(--line)}
.sbtn.primary{background:var(--blue);color:#fff} .sbtn.danger{background:#ffe0e0;color:#c03030}
.pinpad{display:grid;grid-template-columns:repeat(3,90px);gap:12px;justify-content:center}
.pinpad button{background:var(--card);border-radius:18px;font-size:34px;font-weight:800;height:80px;box-shadow:0 4px 0 var(--line)}
.pindots{font-size:44px;letter-spacing:14px;text-align:center;min-height:56px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b2f2a;color:#fff;padding:14px 22px;border-radius:16px;font-size:18px;display:none;gap:14px;align-items:center;z-index:50}
.toast.on{display:flex}
.toast button{background:var(--orange);color:#fff;border-radius:10px;padding:8px 14px;font-size:18px;font-weight:700}
.gear{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));background:var(--card);border-radius:50%;width:56px;height:56px;font-size:28px;box-shadow:0 3px 0 var(--line);opacity:.7}
.levels .big{font-size:22px;padding:16px 10px}
.levels .best{font-size:16px;color:var(--accent);font-weight:700;min-height:20px}
.levels .mini{display:flex;gap:2px;justify-content:center;min-height:34px}
.levels .mini svg{width:34px;height:34px}
.toggle{text-align:center}
.toggle button{background:none;color:var(--sub);font-size:17px;text-decoration:underline}
/* たての 高さに あわせて 大きさを かえる(iPad mini や 古い iPad でも ボタンが はみ出さないように) */
@media (orientation:portrait){
  .mon{height:min(250px,19vh)}
  .playwrap.mid .mon{height:min(170px,13vh)}
  .playwrap.compact .mon{height:min(110px,7vh)}
  .playwrap.compact #calc-img svg{width:min(200px,16vh);height:min(200px,16vh)}
  .keypad button{padding:clamp(10px,1.7vh,22px) 0}
  .question{font-size:min(60px,5.4vh)}
}
/* きせかえ */
.pface{display:block;width:84px;height:94px} .pface svg{width:100%;height:100%}
.home-chara{height:min(300px,26vh);display:flex;justify-content:center}
.home-chara svg{height:100%;width:auto;border-radius:24px;animation:bob 2.6s ease-in-out infinite}
.mon.gift svg{width:auto}
.mon.open svg{animation:open .9s forwards}
@keyframes open{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-8deg)}55%{transform:scale(.9) rotate(6deg)}100%{transform:scale(1.6);opacity:0}}
.hp.gift i{background:linear-gradient(90deg,#ff9fc6,#ff5d8f)}
/* バトル: はじめに 3たい ならび、じかんで 1たいずつ にげる */
.mon.trio{gap:4px;align-items:stretch}
.mon.trio .mc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.mon.trio .mc svg{flex:1 1 0;min-height:0;width:100%;height:auto}
.mc-t{font-size:15px;font-weight:800;color:var(--sub);white-space:nowrap;line-height:1.3}
.mc.near .mc-t{color:var(--ng)}
.mon:not(.hit):not(.attack):not(.down):not(.open) .mc.near svg{animation:nervous .35s infinite}
@keyframes nervous{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.mon .mc.gone svg{animation:flee .9s forwards}
@keyframes flee{0%{transform:none;opacity:1}20%{transform:translateY(-12px)}100%{transform:translateX(140%) translateY(-30px) rotate(25deg);opacity:0}}
/* 30びょう アタック */
.mon.appear svg{animation:appear .6s}
.tline.crit #ta-t{color:var(--ng)}
.mon.ta-best{align-items:center;justify-content:space-around}
.ta-best div{text-align:center}
.ta-best b{display:block;font-size:min(84px,10vh);line-height:1.1;font-variant-numeric:tabular-nums}
.ta-best span{font-size:20px;color:var(--sub);font-weight:700}
.ta-best .now b{color:var(--accent2)}
.ta-best .now.over b,.ta-best .now.over span{color:var(--ng)}
.r-pair{display:flex;align-items:center;justify-content:center;gap:12px;height:100%}
.r-pair .r-item{width:110px;height:110px;background:var(--bg);border-radius:20px;padding:6px}
.r-pair .r-item svg{width:100%;height:100%}
.r-pair .chara{height:100%;width:auto;border-radius:18px}
#s-result .r-mon{height:min(320px,30vh)}
.btn.wear{background:#ff5d8f}
.mthumb{display:inline-flex;width:34px;height:34px;border-radius:8px;background:var(--bg);overflow:hidden;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--sub)}
.mthumb svg{width:100%;height:100%}
.closet{display:flex;flex-direction:column;gap:14px}
.cl-chara{background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--line);display:flex;justify-content:center;height:min(420px,36vh);padding:8px;overflow:hidden}
.cl-chara svg{height:100%;width:auto;border-radius:20px}
.cl-tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cl-tabs button{background:var(--card);border-radius:14px;padding:8px 2px;font-size:24px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.cl-tabs button span{font-size:12px;font-weight:700;color:var(--sub)}
.cl-tabs button.on{background:var(--accent)} .cl-tabs button.on span{color:#fff}
.cl-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cl-item{background:var(--card);border-radius:18px;padding:8px 6px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:13px;font-weight:700;border:3px solid transparent}
.cl-item svg{width:100%;height:96px}
.cl-item.worn{border-color:var(--accent)}
.cl-item .w{position:absolute;top:4px;left:6px;background:var(--accent);color:#fff;font-style:normal;font-size:12px;border-radius:8px;padding:1px 6px}
.cl-item .k{position:absolute;top:4px;right:6px;font-style:normal}
.cl-item.lock{opacity:.6;box-shadow:none;background:transparent;border:3px dashed var(--line)}
.cl-item.lock .q{height:96px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:var(--sub)}
.cl-item.lock span{font-weight:400;color:var(--sub);text-align:center;font-size:12px}
@media (orientation:landscape) and (min-width:900px){
  .closet{display:grid;grid-template-columns:minmax(260px,.8fr) 1.4fr;align-items:start}
  .cl-chara{height:calc(100vh - 130px);position:sticky;top:12px}
  .cl-tabs{grid-template-columns:repeat(4,1fr)}
}
/* ログイン */
.login{background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.login label{display:flex;flex-direction:column;gap:6px;font-size:20px;font-weight:800}
.login input{font-size:30px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);font-family:inherit;background:#fff;color:#3b2f2a;-webkit-user-select:text;user-select:text}
.login input:focus{outline:none;border-color:var(--accent2)}
.lg-msg{color:var(--ng);font-weight:800;min-height:24px;margin:0;text-align:center}
.lg-warn{color:#c03030}
.rg-style{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rg-style button{background:var(--bg);border-radius:20px;padding:14px 8px;font-size:22px;font-weight:800;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.rg-style button span{font-size:48px}
.rg-style button small{font-size:14px;font-weight:400;color:var(--sub)}
.rg-style button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.tri{width:min(300px,60vw);height:auto}
.playwrap.compact #calc-img svg.tri{width:min(300px,30vh);height:auto}
/* あそびかた えらび */
.modal .box.wide{max-width:640px}
.md-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* =========================================
   まなびランド：ファッション着せ替えUI
   見た目のみ変更。既存の機能・データは変更しない
   ========================================= */

.closet {
  gap: 16px;
}

/* キャラクターのステージ */
.cl-chara {
  position: relative;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 32%,
      rgba(255,255,255,.98) 0%,
      rgba(255,245,250,.96) 42%,
      rgba(237,226,255,.92) 100%);
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 30px;
  box-shadow:
    0 8px 24px rgba(132,91,151,.10),
    inset 0 0 0 5px rgba(255,255,255,.45);
  padding: 12px;
  overflow: hidden;
}

.cl-chara::before {
  content: "✦";
  position: absolute;
  top: 16px;
  left: 18px;
  color: #e7b5db;
  font-size: 23px;
  pointer-events: none;
}

.cl-chara::after {
  content: "✧";
  position: absolute;
  right: 20px;
  top: 48px;
  color: #c6b1f5;
  font-size: 30px;
  pointer-events: none;
}

.cl-chara svg {
  position: relative;
  z-index: 1;
  max-width: 100%;
  filter: drop-shadow(0 5px 5px rgba(100,70,110,.08));
}

/* カテゴリー選択 */
.cl-tabs {
  gap: 8px;
}

.cl-tabs button {
  min-width: 0;
  background: linear-gradient(160deg, #fff 0%, #fff8fc 100%);
  border: 1px solid #f0dfed;
  border-radius: 17px;
  padding: 10px 3px;
  box-shadow: 0 3px 0 #ead9e8;
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

.cl-tabs button:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #ead9e8;
}

.cl-tabs button span {
  color: #8e7893;
  font-size: 11px;
}

.cl-tabs button.on {
  background: linear-gradient(145deg, #f6c5e2 0%, #d9c8ff 100%);
  border-color: #e7b6df;
  box-shadow:
    0 3px 0 #d6b2d7,
    0 5px 14px rgba(190,133,190,.16);
}

.cl-tabs button.on span {
  color: #593c68;
}

/* 服・アイテム一覧 */
.cl-items {
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 12px;
}

.cl-item {
  background: linear-gradient(160deg, #fff 0%, #fffafd 100%);
  border: 2px solid #f1e5f0;
  border-radius: 20px;
  padding: 10px 8px;
  box-shadow: 0 4px 0 #eadfea;
  gap: 6px;
  color: #5f4a63;
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease;
}

.cl-item:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #eadfea;
}

.cl-item svg {
  height: 100px;
}

/* 着用中のアイテム */
.cl-item.worn {
  border-color: #d79cda;
  background: linear-gradient(160deg, #fff8ff 0%, #f5eaff 100%);
  box-shadow:
    0 4px 0 #d8b8df,
    0 0 0 2px rgba(226,183,232,.18);
}

.cl-item .w {
  top: 6px;
  left: 6px;
  background: linear-gradient(135deg, #d98dc8, #ae91e9);
  color: #fff;
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 10px;
  box-shadow: 0 2px 5px rgba(130,80,140,.16);
}

.cl-item .k {
  top: 5px;
  right: 6px;
}

/* 未解放アイテム */
.cl-item.lock {
  background: #f8f5f9;
  border: 2px dashed #ded2e3;
  box-shadow: none;
}

.cl-item.lock .q {
  color: #b5a3be;
}

.cl-item.lock span {
  color: #98879f;
}

/* タブレット・スマートフォン */
@media (max-width: 600px) {
  .closet {
    gap: 12px;
  }

  .cl-chara {
    height: min(390px, 42vh);
    min-height: 220px;
    border-radius: 24px;
  }

  .cl-tabs {
    gap: 5px;
  }

  .cl-tabs button {
    border-radius: 13px;
    padding: 8px 1px;
    font-size: 21px;
  }

  .cl-tabs button span {
    font-size: 10px;
  }

  .cl-items {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
  }

  .cl-item {
    border-radius: 16px;
    padding: 8px 5px;
    font-size: 12px;
  }

  .cl-item svg {
    height: 84px;
  }
}

/* 横向きの小型画面 */
@media (orientation: landscape) and (max-height: 600px) {
  .cl-chara {
    height: min(72vh, 420px);
  }
}

/* 動きを減らす設定を尊重 */
@media (prefers-reduced-motion: reduce) {
  .cl-tabs button,
  .cl-item {
    transition: none;
  }
}


/* やっつけ エフェクト */
.arena.quake{animation:quake .45s}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,2px)}}
.boom{position:absolute;width:0;height:0;pointer-events:none;z-index:5}
.boom .flash{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6b0 35%,rgba(255,220,80,0) 70%);animation:bflash .5s forwards}
@keyframes bflash{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.boom .ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:8px solid #ffd23f;animation:bring .6s forwards}
.boom .ring.r2{border-color:#ff7a3d;animation-delay:.1s;opacity:0}
@keyframes bring{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.6);opacity:0;border-width:1px}}
.boom span{position:absolute;left:0;top:0;font-size:34px;line-height:1;opacity:0;animation:bfly .9s ease-out forwards}
@keyframes bfly{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(1.1);opacity:0}}
.boom b{position:absolute;left:0;top:0;white-space:nowrap;font-size:clamp(36px,7vw,60px);font-weight:900;color:#ffd23f;
  -webkit-text-stroke:3px #c2410c;paint-order:stroke fill;text-shadow:0 4px 0 #9a3412;animation:btext 1.3s forwards}
@keyframes btext{0%{transform:translate(-50%,-50%) scale(0) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.35) rotate(4deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}85%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
/* けいさん プレイ: がめんの たかさに おさめる(たりない ときは キャラと ボタンが ちぢむ) */
#s-calc-play.on{flex:none;height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));gap:10px;overflow:hidden}
#s-calc-play .playwrap{min-height:0;gap:10px}

#s-calc-play .arena{flex:0 1 auto;min-height:150px;display:flex;flex-direction:column}

#s-calc-play .keypad{flex:1 1 auto;min-height:190px;max-height:470px;grid-auto-rows:1fr;margin-top:0}
#s-calc-play .keypad button{padding:0;min-height:0}
@media (max-height:700px){ #s-calc-play .keypad{gap:8px} #s-calc-play .keypad button{font-size:30px} }
@media (orientation:landscape) and (min-width:900px){

  #s-calc-play .stage{display:flex;flex-direction:column;min-height:0}
  #s-calc-play .keypad{align-self:center;height:min(470px,100%)}
}

    <div class="bar">
      <button class="back" data-go="home">← もどる</button>
      <div class="timebox"><div class="lbl"><span>ずかん</span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="zk-count" id="zk-count"></div>
    <div id="zk-list" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- きせかえ ルーム -->
  <section class="screen" id="s-closet">
    <div class="bar">
      <button class="back" data-go="home">← もどる</button>
      <div class="timebox"><div class="lbl"><span id="cl-count"></span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="closet">
      <div class="cl-chara" id="cl-chara"></div>
      <div class="cl-side">
        <div class="cl-tabs" id="cl-tabs"></div>
        <div class="cl-items" id="cl-items"></div>
      </div>
    </div>
  </section>

  <!-- かんじ メニュー -->
  <section class="screen" id="s-kanji">
    <div class="bar">
      <button class="back" data-go="home">← もどる</button>
      <div class="timebox"><div class="lbl"><span>かんじ</span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="seg ktabs" id="k-grades"></div>
    <div class="grid kfeat">
      <button class="big" data-go="kobo" id="k-kobo-btn"><span class="emoji">🧩</span>くみたて こうぼう<span class="note" id="k-kobo-note"></span></button>
      <button class="big" data-go="kzukan"><span class="emoji">📖</span>かんじ ずかん<span class="note" id="k-zukan-note"></span></button>
    </div>
    <div class="grid levels" id="k-modes"></div>
  </section>

  <!-- かんじ プレイ -->
  <section class="screen" id="s-kplay">
    <div class="bar">
      <button class="back" id="kp-quit">✕ やめる</button>
      <div class="timebox"><div class="lbl"><span id="kp-title"></span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="playwrap" id="kp-wrap">
      <div class="stage">
        <div class="arena kgauge"><span>🧩</span><div class="hp gift" id="kp-gauge"><i></i></div><span class="hpnum" id="kp-count"></span></div>
        <div class="qcard">
          <div class="qnum" id="kp-prompt"></div>
          <div id="kp-body"></div>
          <div class="feedback" id="kp-fb"></div>
        </div>
      </div>
      <div class="choices" id="kp-choices"></div>
    </div>
  </section>

  <!-- くみたて こうぼう -->
  <section class="screen" id="s-kobo">
    <div class="bar">
      <button class="back" data-go="kanji">← もどる</button>
      <div class="timebox"><div class="lbl"><span id="kb-count"></span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="kb-top">
      <div class="kb-stats" id="kb-stats"></div>
      <div class="kb-slots" id="kb-slots"></div>
      <p class="sub" id="kb-hint"></p>
      <div class="btnrow"><button class="btn gray" id="kb-clear">やりなおす</button><button class="btn main" id="kb-make">🔨 くみたてる</button></div>
    </div>
    <div class="kb-tray" id="kb-tray"></div>
  </section>

  <!-- かんじ ずかん -->
  <section class="screen" id="s-kzukan">
    <div class="bar">
      <button class="back" data-go="kanji">← もどる</button>
      <div class="timebox"><div class="lbl"><span id="kz-count"></span><span>のこり <b class="remain"></b></span></div><div class="meter"><i></i></div></div>
    </div>
    <div class="seg ktabs" id="kz-grades"></div>
    <div class="kz-grid" id="kz-grid"></div>
  </section>

  <!-- おしまい -->
  <section class="screen" id="s-timeup">
    <div class="timeup">
      <div class="emoji">🌙</div>
      <h2 id="tu-title">きょうは ここまで!</h2>
      <p class="sub" id="tu-text">また あした あそぼうね</p>
      <button class="btn" data-go="profiles">さいしょの がめんへ</button>
    </div>
  </section>

  <!-- 保護者: PIN -->
  <section class="screen" id="s-pin">
    <div class="bar"><button class="back" data-go="profiles">← もどる</button></div>
    <h2 id="pin-title">保護者の暗証番号</h2>
    <p class="sub" id="pin-sub">4けたの数字を入力してください</p>
    <div class="pindots" id="pin-dots"></div>
    <div class="pinpad" id="pinpad"></div>
  </section>

  <!-- 保護者: 設定 -->
  <section class="screen" id="s-parent">
    <div class="bar"><button class="back" data-go="profiles">← 終了</button><h2 class="grow">保護者設定</h2></div>
    <div id="parent-body" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

</div>

<div class="modal" id="zk-modal"><div class="box" id="zk-box"></div></div>
<div class="toast" id="update-toast"><span>新しいバージョンがあります</span><button id="update-btn">更新</button></div>

<script src="data.js"></script>
<script src="monsters.js"></script>
<script src="levels.js"></script>
<script src="dressup.js"></script>
<script src="heroes.js"></script>
<script src="rewards.js"></script>
<script src="app.js"></script>
<script src="kanji.js"></script>
</body>
</html>
